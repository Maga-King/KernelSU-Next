name: ClangFormat check

on:
  push:
    branches: [ "next", "dev" ]
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'kernel/.clang-format'
      - 'scripts/check_fork_format.py'
  pull_request:
    branches: [ "next", "dev" ]
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'kernel/.clang-format'
      - 'scripts/check_fork_format.py'

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Use pinned formatter
        run: |
          python -m pip install --disable-pip-version-check clang-format==18.1.8
          clang-format --version

      - name: Check fork-owned sources (preserve upstream formatting)
        run: python scripts/check_fork_format.py
