name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      manager_package:
        description: 'manager package name'
        required: false
        default: ''
        type: string
      expected_manager_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_manager_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
      static_selinux_reference:
        description: '启用静态 SELinux 参考策略'
        required: false
        default: false
        type: boolean
      selinux_reference_source:
        description: '参考策略：OriginOS / ColorOS17 / HyperOS'
        required: false
        default: OriginOS
        type: string
  workflow_dispatch:
    inputs:
      static_selinux_reference:
        description: '启用静态 SELinux 参考策略'
        required: false
        default: false
        type: boolean
      selinux_reference_source:
        description: '开启后使用哪一套参考策略（三选一）'
        required: true
        default: OriginOS
        type: choice
        options:
          - OriginOS
          - ColorOS17
          - HyperOS
jobs:
  build-lkm-ksu:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-ksu.yml
    with:
      kmi: ${{ matrix.kmi }}
      manager_package: ${{ inputs.manager_package || '' }}
      expected_manager_size: ${{ inputs.expected_manager_size || '' }}
      expected_manager_hash: ${{ inputs.expected_manager_hash || '' }}
      static_selinux_reference: ${{ inputs.static_selinux_reference || false }}
      selinux_reference_source: ${{ inputs.selinux_reference_source || 'OriginOS' }}
  
  build-lkm-susfs:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-susfs.yml
    with:
      kmi: ${{ matrix.kmi }}
